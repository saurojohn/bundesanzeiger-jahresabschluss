# =============================================================================
# CI — Bundesanzeiger Jahresabschluss
# =============================================================================
# Erstellt 2026-09-28,第一次 echter Lauf 2026-09-30.
#
# Aus dieser Pipeline ist hervorgegangen, dass "grün markiert" nichts bedeutet,
# solange niemand ausführt. Rund 40 Defekte waren über Wochen als fertig
# geführt, obwohl kein Testlauf stattfand.
#
# Zwei Dinge haben die ersten Läufe rot gemacht — beide hier behoben:
#   1. `needs:` ordnet nur die REIHENFOLGE. GitHub gibt jedem Job eine eigene
#      VM. Der Frontend-Job fand deshalb kein Backend auf localhost:3000 und
#      jeder Login scheiterte mit ECONNREFUSED.
#   2. Die CRL-Testartefakte (echte OpenSSL-CA) wurden nicht erzeugt;
#      crl-checker.spec.ts bricht dafür bewusst hart ab.
# =============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Prisma + Typecheck + Lint + e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: banz
          POSTGRES_PASSWORD: banz_ci_pw
          POSTGRES_DB: bundesanzeiger
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U banz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_VERSION: '22'
      DATABASE_URL: postgresql://banz:banz_ci_pw@localhost:5432/bundesanzeiger?schema=public
      JWT_SECRET: ci-only-not-a-real-secret-0000000000000000000000000000
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_REGION: eu-central-1
      S3_ACCESS_KEY: ciaccesskey
      S3_SECRET_KEY: cisecretkey
      S3_BUCKET: banz-worm
      S3_OBJECT_LOCK_MODE: COMPLIANCE
      S3_OBJECT_LOCK_RETENTION_DAYS: '3650'
      S3_PRESIGN_EXPONENT: '1'
      CACHE_PROVIDER: memory
      # Leer -> Signaturpfad nutzt den Mock-TSA und weist das in der Antwort aus.
      TSA_URL: ''
      PORT: '3000'
      NODE_ENV: test
      # CORS: main.ts erlaubt per Default nur http://localhost:3000.
      # Die Playwright-Routen laufen auf 3001; ohne diese Zeile
      # antwortete das Backend mit "CORS: Origin nicht erlaubt".
      FRONTEND_URL: http://localhost:3001

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # MinIO ist als Open-Source archiviert; der Mock bildet die vier
      # benötigten Operationen inkl. echter Object-Lock-Semantik nach.
      # Ohne ihn läuft die WORM-Strecke nicht und die WORM-Tests prüfen nichts.
      - name: S3-Mock starten
        working-directory: backend
        run: |
          node ../s3-mock/server.js &
          for i in $(seq 1 20); do
            curl -sf -o /dev/null http://127.0.0.1:9000/ && break
            sleep 1
          done
          curl -sf -o /dev/null http://127.0.0.1:9000/ || { echo "::error::S3-Mock nicht bereit"; exit 1; }

      - name: Dependencies installieren
        working-directory: backend
        run: npm ci

      - name: Prisma Client generieren
        working-directory: backend
        run: npx prisma generate

      - uses: ./.github/actions/setup-backend

      - name: "Typecheck (Gesamtbaum: src + e2e + prisma + Tools)"
        working-directory: backend
        run: npm run typecheck

      - name: Lint
        working-directory: backend
        run: npm run lint

      - name: Build
        working-directory: backend
        run: npm run build

      - name: e2e (Vitest)
        working-directory: backend
        run: npx vitest run --reporter=verbose

      - name: Logs
        if: failure()
        run: tail -120 /tmp/backend.log || true

      - name: Artefakte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-logs
          path: /tmp/backend.log
          retention-days: 7

  frontend:
    name: Frontend (Typecheck + Build + Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Bewusst KEIN `needs: backend`. Beide Jobs laufen parallel auf getrennten
    # VMs; der Frontend-Job startet sein eigenes Backend (siehe unten).

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: banz
          POSTGRES_PASSWORD: banz_ci_pw
          POSTGRES_DB: bundesanzeiger
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U banz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_VERSION: '22'
      DATABASE_URL: postgresql://banz:banz_ci_pw@localhost:5432/bundesanzeiger?schema=public
      JWT_SECRET: ci-only-not-a-real-secret-0000000000000000000000000000
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_REGION: eu-central-1
      S3_ACCESS_KEY: ciaccesskey
      S3_SECRET_KEY: cisecretkey
      S3_BUCKET: banz-worm
      S3_OBJECT_LOCK_MODE: COMPLIANCE
      S3_OBJECT_LOCK_RETENTION_DAYS: '3650'
      S3_PRESIGN_EXPONENT: '1'
      CACHE_PROVIDER: memory
      TSA_URL: ''
      PORT: '3000'
      NODE_ENV: test
      # CORS: main.ts erlaubt per Default nur http://localhost:3000.
      # Die Playwright-Routen laufen auf 3001; ohne diese Zeile
      # antwortete das Backend mit "CORS: Origin nicht erlaubt".
      FRONTEND_URL: http://localhost:3001
      NEXT_PUBLIC_API_URL: http://127.0.0.1:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # Die Playwright-Smoke-Tests melden sich real an und laden Fachseiten.
      # Sie brauchen ein laufendes Backend — es lebt auf einer ANDEREN VM als
      # der Backend-Job, also starten wir hier ein eigenes.
      - name: S3-Mock starten
        working-directory: backend
        run: |
          node ../s3-mock/server.js &
          for i in $(seq 1 20); do
            curl -sf -o /dev/null http://127.0.0.1:9000/ && break
            sleep 1
          done

      - name: Backend installieren + starten
        working-directory: backend
        run: |
          npm ci
          npx prisma generate

      - uses: ./.github/actions/setup-backend

      - name: Frontend installieren
        working-directory: frontend
        run: npm ci

      - name: Frontend Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Frontend Build
        working-directory: frontend
        run: npm run build

      - name: Playwright-Browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Playwright
        working-directory: frontend
        run: npx playwright test

      - name: Frontend-Logs
        if: failure()
        run: |
          echo "--- backend ---"; tail -60 /tmp/backend.log || true
          echo "--- frontend ---"; tail -60 /tmp/frontend.log 2>/dev/null || true

      - name: Trace/Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
