# ============================================================================
# Bundesanzeiger Jahresabschluss — Development Stack
# ============================================================================
# Start mit: docker compose up
# Stop mit:   docker compose down
# Reset:      docker compose down -v (VORSICHT: löscht alle Daten!)
# ============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: banz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: banz_jahresabschluss
      POSTGRES_USER: banz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-banz_dev_pwd}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banz -d banz_jahresabschluss"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: banz-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: banz-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-banz_dev_access}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-banz_dev_secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: banz-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://banz:${POSTGRES_PASSWORD:-banz_dev_pwd}@postgres:5432/banz_jahresabschluss?schema=public
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
    ports:
      - "3000:3000"
    volumes:
      - ../backend/src:/app/src:ro
      - ../backend/prisma:/app/prisma:ro
    command: sh -c "npx prisma migrate deploy && npm run dev"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: banz-frontend
    restart: unless-stopped
    depends_on:
      - backend
    env_file:
      - ../.env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000
    ports:
      - "3001:3000"
    volumes:
      - ../frontend/src:/app/src:ro

volumes:
  postgres-data:
  redis-data:
  minio-data: