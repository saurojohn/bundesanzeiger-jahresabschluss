# ============================================================================
# NGINX Production Config (M4 Sprint 2) — Blue-Green-Deployment
# ============================================================================
# Zweck:
#   - TLS-Termination (Let's Encrypt Wildcard)
#   - Blue-Green-Load-Balancing zwischen backend-blue + backend-green
#   - Atomatischer Switch via /health/ready-Probe
#   - Security-Headers (HSTS, X-Frame-Options, etc.)
#
# Aktiv-Schaltung:
#   bash /etc/banz/blue-green-switch.sh green
#   bash /etc/banz/blue-green-switch.sh blue
#
# Mount-Point in docker-compose.prod.yml:
#   ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
# ============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    # =========================================================================
    # Basis-Settings
    # =========================================================================
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # =========================================================================
    # Logging
    # =========================================================================
    log_format banz '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'pool=$pool rt=$request_time';

    access_log /var/log/nginx/access.log banz buffer=32k flush=5s;

    # =========================================================================
    # Gzip
    # =========================================================================
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # =========================================================================
    # Rate-Limiting (zusätzlich zum App-Throttler)
    # =========================================================================
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
    limit_req_status 429;

    # =========================================================================
    # Upstream-Definitionen (Blue + Green)
    # =========================================================================
    # NGINX entscheidet pro Request welcher Pool aktiv ist via
    # Variable $active_pool. Diese wird vom blue-green-switch.sh gesetzt.
    upstream backend_blue {
        server backend-blue:3000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream backend_green {
        server backend-green:3000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # Initial: Blue aktiv (kann zur Boot-Zeit nicht aus Datei lesen)
    set $active_pool "blue";
    set $backend_upstream backend_blue;

    # =========================================================================
    # Security-Headers
    # =========================================================================
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self';" always;

    # =========================================================================
    # HTTP → HTTPS Redirect
    # =========================================================================
    server {
        listen 80;
        listen [::]:80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # =========================================================================
    # HTTPS-Server (Wildcard-Cert *.banz.example.com)
    # =========================================================================
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name banz.example.com *.banz.example.com;

        # Let's Encrypt Wildcard-Cert (per Volume-Mount eingebunden)
        ssl_certificate /etc/letsencrypt/live/banz.example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/banz.example.com/privkey.pem;
        ssl_dhparam /etc/nginx/dhparam.pem;

        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers off;

        # OCSP-Stapling
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 1.1.1.1 8.8.8.8 valid=300s;
        resolver_timeout 5s;

        # =========================================================================
        # Health-Endpoint (für externes Monitoring + Load-Balancer-Probes)
        # =========================================================================
        location = /health {
            # Direkt zur active-pool weiterleiten (kein Proxy-Cache)
            proxy_pass http://$backend_upstream/health;
            proxy_set_header Host $host;
            access_log off;
        }

        location = /health/ready {
            proxy_pass http://$backend_upstream/health/ready;
            proxy_set_header Host $host;
            access_log off;
        }

        # =========================================================================
        # API-Traffic (Mandant-Trennung, OAuth2)
        # =========================================================================
        location /api/ {
            limit_req zone=general burst=20 nodelay;

            proxy_pass http://$backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Pool $active_pool;
            proxy_set_header Connection "";

            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            proxy_buffering on;
            proxy_buffer_size 16k;
            proxy_buffers 4 32k;
        }

        # =========================================================================
        # OAuth2-Token-Endpoint (eigener Rate-Limit)
        # =========================================================================
        location ~ ^/oauth/(token|introspect|revoke)$ {
            limit_req zone=auth burst=5 nodelay;

            proxy_pass http://$backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Pool $active_pool;
            proxy_set_header Connection "";
        }

        # =========================================================================
        # Webhook-Incoming (für Kanzlei-Systeme die Webhooks an uns senden)
        # =========================================================================
        location /webhooks/ {
            limit_req zone=general burst=10 nodelay;

            proxy_pass http://$backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Pool $active_pool;
        }

        # =========================================================================
        # OpenAPI-Docs (öffentlich für Integration-Partner)
        # =========================================================================
        location /api/docs {
            proxy_pass http://$backend_upstream/api/docs;
            proxy_set_header Host $host;
        }

        # =========================================================================
        # Static Files (für spätere Frontend-Integration)
        # =========================================================================
        location /static/ {
            alias /var/www/static/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # =========================================================================
        # Alles andere → 404
        # =========================================================================
        location / {
            return 404 "Bundesanzeiger Jahresabschluss — API nicht unter diesem Pfad verfügbar";
        }
    }

    # =========================================================================
    # Custom-Domain-Support (White-Label-Kanzleien)
    # =========================================================================
    # Kanzleien mit eigener Domain (kanzlei-domain.de) bekommen einen
    # virtuellen Server-Eintrag. certbot-managed per Kanzlei.
    # Beispiel-Config in /etc/nginx/conf.d/kanzlei-domain.conf
    include /etc/nginx/conf.d/*.conf;
}